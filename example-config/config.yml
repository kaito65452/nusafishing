# ==============================================================================
# Fishing Tournaments
# ------------------------------------------------------------------------------
# Sustainable prize pools scaled to prevent coin inflation:
# - Daily:  1st 3,500 coins | 2nd 1,500 coins | 3rd 750 coins
# - Weekly: 1st 15,000 coins | 2nd 7,500 coins | 3rd 3,500 coins
# ==============================================================================
tournaments:
  min_time_between_tournaments: 60
  auto_schedule: true
  scheduled:
    daily_heaviest:
      name: "Turnamen Ikan Terberat Harian"
      description: "Tangkap ikan dengan bobot terberat untuk merebut piala juara!"
      type: HEAVIEST_FISH
      duration_minutes: 30
      hour_of_day: 18
      minute_of_hour: 0
      days_of_week:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      auto_start: true
      rewards:
        first_place:
          money: 3500
          exp: 300
          commands:
            - "give %player% diamond 3"
        second_place:
          money: 1500
          exp: 150
          commands:
            - "give %player% diamond 1"
        third_place:
          money: 750
          exp: 75
          commands: []

    weekly_most_fish:
      name: "Turnamen Nelayan Handal Mingguan"
      description: "Tangkap ikan sebanyak mungkin selama 1 jam penuh!"
      type: MOST_FISH
      duration_minutes: 60
      hour_of_day: 20
      minute_of_hour: 0
      days_of_week:
        - SATURDAY
      auto_start: true
      rewards:
        first_place:
          money: 15000
          exp: 1000
          commands:
            - "give %player% netherite_ingot 1"
            - "give %player% diamond 10"
        second_place:
          money: 7500
          exp: 500
          commands:
            - "give %player% diamond 5"
        third_place:
          money: 3500
          exp: 250
          commands:
            - "give %player% diamond 2"
