    max_weight_capacity: 50000.0

# Pengaturan umpan
fishing_baits:
  worm:
    name: "Cacing Tanah"
    description: "Umpan dasar untuk ikan kecil"
    material: WHEAT_SEEDS
    custom_model_data: 2001
    valid_fish: [small_carp, small_catfish, small_tilapia]
    attraction_modifier: 3.0     # Dari 1.5 menjadi 3.0 (200% peningkatan)
    tier_boost: 0
    uses_per_item: 5            # Dari 3 menjadi 5 penggunaan
    price: 10
    quality_boost: 1.25         # Dari 1.1 menjadi 1.25 (25% boost)
    weight_boost: 1.20          # Dari 1.05 menjadi 1.20 (20% boost)
    
  cricket:
    name: "Jangkrik"
    description: "Umpan untuk ikan sedang"
    material: BEETROOT_SEEDS
    custom_model_data: 2002
    valid_fish: [carp, catfish, tilapia, small_snakehead]
    attraction_modifier: 4.0     # Dari 1.8 menjadi 4.0 
    tier_boost: 1               # Dari 0 menjadi 1 (chance naik tier)
    uses_per_item: 7            # Dari 5 menjadi 7 penggunaan
    price: 20
    quality_boost: 1.35         # Dari 1.15 menjadi 1.35 (35% boost)
    weight_boost: 1.30          # Dari 1.1 menjadi 1.30 (30% boost)
    
  small_fish:
    name: "Ikan Kecil"
    description: "Umpan untuk ikan predator"
    material: TROPICAL_FISH
    custom_model_data: 2003
    valid_fish: [snakehead, giant_catfish, barracuda]
    attraction_modifier: 5.0     # Dari 2.2 menjadi 5.0
    tier_boost: 2               # Dari 1 menjadi 2 (lebih tinggi chance naik tier)
    uses_per_item: 4            # Dari 2 menjadi 4 penggunaan
    price: 50
    quality_boost: 1.50         # Dari 1.2 menjadi 1.50 (50% boost)
    weight_boost: 1.45          # Dari 1.15 menjadi 1.45 (45% boost)
    
  rare_bait:
    name: "Umpan Premium"
    description: "Umpan berkualitas tinggi untuk semua ikan"
    material: HEART_OF_THE_SEA
    custom_model_data: 2004
    valid_fish: []              # Bisa menangkap semua ikan
    attraction_modifier: 8.0     # Dari 3.0 menjadi 8.0 (drastis)
    tier_boost: 3               # Dari 2 menjadi 3 (hampir pasti naik tier)
    uses_per_item: 3            # Dari 1 menjadi 3 penggunaan
    price: 100
    quality_boost: 2.0          # Dari 1.3 menjadi 2.0 (100% boost kualitas)
    weight_boost: 2.0           # Dari 1.25 menjadi 2.0 (100% boost berat)

