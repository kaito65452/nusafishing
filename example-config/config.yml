# ==============================================================================
# NusaFishing - Stable Anti-Inflation Main Configuration (config.yml)
# ==============================================================================
config_version: "1.4"

# ==============================================================================
# AuraSkills Integration
# Wiki: https://wiki.aurelium.dev/auraskills/api
# ==============================================================================
auraskills:
  # Mengaktifkan/menonaktifkan pemberian skill XP AuraSkills saat memancing
  enabled: true
  # Base XP memancing per tangkapan
  base_xp: 15.0
  # Multiplier XP berdasarkan tier ikan
  tier_xp_multipliers:
    COMMON: 1.0
    UNCOMMON: 1.5
    RARE: 2.5
    EPIC: 4.0
    LEGENDARY: 7.0
    MYTHIC: 12.0

# ==============================================================================
# Auto-Fishing / AFK Fishing Settings (/nf afk)
# Format luck-nerf dan speed-nerf menggunakan format <angka>%
# ==============================================================================
afk_fishing:
  # Mengaktifkan/menonaktifkan fitur /nf afk
  enabled: true
  # Nerf keberuntungan (mengurangi peluang ikan tier tinggi & bobot)
  luck-nerf: 20%
  # Nerf kecepatan (memperlambat waktu tunggu & waktu tarikan)
  speed-nerf: 30%

# MATHEMATICAL ECONOMY & BALANCE OVERVIEW:
# ------------------------------------------------------------------------------
# In previous versions, uncalibrated base prices and compound multipliers caused
# severe server economy hyperinflation:
#   - Old Event Fish: Base price 150,000 - 200,000 compounded by weight (1.4x),
#     quality (1.45x), tier (1.5x), and Collector GUI (1.5x), producing single-fish
#     payouts exceeding 650,000 - 1,200,000 coins.
#   - Old Equipment: Mythic Rod cost 750,000 coins with repair costs of 5.0/dur
#     scaled by 8.0x (100,000 coins per repair), alienating legitimate players
#     while hyper-inflating the richest ones.
#
# BALANCED ECONOMIC TARGETS (Per Active Fishing Hour):
#   - Early Game (Basic Rod + Worms):        ~350 - 550 net coins/hour
#   - Mid Game (Advanced Rod + Medium Bait): ~1,500 - 2,800 net coins/hour
#   - Late Game (Expert/Master Rod):         ~4,000 - 6,500 net coins/hour
#   - End Game (Mythic Rod + Rare Bait):     ~7,500 - 11,000 net coins/hour
#   - Event Boss Catch (Prestigious Event):  ~6,000 - 15,000 coins (1.5x Collector)
#
# Sinks (Durability Repair + Bait Consumption) are calibrated to consume 20-30%
# of gross catches, preventing long-term coin saturation.
# ==============================================================================

# Custom tier colors (Supports Minecraft legacy formatting codes: &0-&f, &l, etc.)
tier_colors:
  fish:
    COMMON: "&7"
    UNCOMMON: "&a"
    RARE: "&9"
    EPIC: "&5"
    LEGENDARY: "&6"
    MYTHIC: "&c"
  rod:
    BASIC: "&7"
    INTERMEDIATE: "&a"
    ADVANCED: "&9"
    EXPERT: "&5"
    MASTER: "&6"
    MYTHIC: "&c"

# ==============================================================================
# Economy Settings & Sinks
# ==============================================================================
economy:
  # Base repair cost per 1 point of lost durability:
  # Final Repair Cost = DurabilityLost * repair_cost_per_durability * TierMultiplier
  repair_cost_per_durability: 0.5

  # Tier-based repair cost multipliers:
  # - BASIC (75 dur full repair):        75 * 0.5 * 1.0 = 37.5 coins
  # - INTERMEDIATE (175 dur full repair): 175 * 0.5 * 1.25 = ~109.4 coins
  # - ADVANCED (400 dur full repair):     400 * 0.5 * 1.75 = 350.0 coins
  # - EXPERT (750 dur full repair):       750 * 0.5 * 2.5 = 937.5 coins
  # - MASTER (1,500 dur full repair):     1,500 * 0.5 * 3.5 = 2,625.0 coins
  # - MYTHIC (3,000 dur full repair):     3,000 * 0.5 * 5.0 = 7,500.0 coins
  repair_cost_multipliers:
    BASIC: 1.0
    INTERMEDIATE: 1.25
    ADVANCED: 1.75
    EXPERT: 2.5
    MASTER: 3.5
    MYTHIC: 5.0

  # Global fish sell price multiplier (1.0 = 100% standard calibrated price)
  fish_price_multiplier: 1.0

  # Dynamic supply and demand market pricing:
  # As players sell large quantities of a fish species, its local value drops temporarily,
  # recovering back to 1.0 hourly. This discourages single-species AFK farming.
  dynamic_pricing: true

  # Random market fluctuation range (±0.2 = prices naturally vary between 0.8x and 1.2x)
  price_fluctuation: 0.2

# ==============================================================================
# Player Stamina Settings
# ==============================================================================
player:
  # Maximum player stamina capacity
  max_stamina: 100.0

  # Stamina regeneration per tick cycle
  stamina_regen: 1.5

  # Delay in ticks before regeneration commences after reeling
  stamina_regen_delay: 20

# ==============================================================================
# Fishing World Events
# ==============================================================================
events:
  # Minimum cooldown between world fishing events (minutes)
  min_cooldown_minutes: 45

  # Maximum cooldown between world fishing events (minutes)
  max_cooldown_minutes: 120

  # Active event duration (minutes)
  duration_minutes: 25

  # Chance per cooldown cycle for an event to trigger (percentage)
  chance_percent: 15.0

  # Valid biomes where event bosses can be encountered
  valid_biomes:
    - OCEAN
    - DEEP_OCEAN
    - WARM_OCEAN
    - LUKEWARM_OCEAN
    - COLD_OCEAN
    - DEEP_LUKEWARM_OCEAN
    - DEEP_COLD_OCEAN
    - FROZEN_OCEAN
    - DEEP_FROZEN_OCEAN
    - RIVER
    - FROZEN_RIVER
    - BEACH
    - SNOWY_BEACH

