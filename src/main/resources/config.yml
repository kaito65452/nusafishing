# NusaFishing Main Configuration
config_version: "1.4+SNAPSHOT"

# AuraSkills Integration
# Wiki: https://wiki.aurelium.dev/auraskills/api
auraskills:
  # Mengaktifkan/menonaktifkan pemberian skill XP AuraSkills saat memancing
  enabled: true
  # Base XP memancing per tangkapan
  base_xp: 15.0
  # Multiplier XP berdasarkan tier ikan
  tier_xp_multipliers:
    COMMON: 1.0
    UNCOMMON: 1.5
    RARE: 2.5
    EPIC: 4.0
    LEGENDARY: 7.0
    MYTHIC: 12.0

# Auto-Fishing / AFK Fishing Settings (/nf afk)
# Format luck-nerf dan speed-nerf menggunakan format <angka>%
afk_fishing:
  # Mengaktifkan/menonaktifkan fitur /nf afk
  enabled: true
  # Nerf keberuntungan (mengurangi peluang ikan tier tinggi & bobot)
  luck-nerf: 20%
  # Nerf kecepatan (memperlambat waktu tunggu & waktu tarikan)
  speed-nerf: 30%

# Tier color customization (Supports Minecraft color codes e.g. &7, &a, &c, etc.)
tier_colors:
  fish:
    COMMON: "&7"
    UNCOMMON: "&a"
    RARE: "&9"
    EPIC: "&5"
    LEGENDARY: "&6"
    MYTHIC: "&c"
  rod:
    BASIC: "&7"
    INTERMEDIATE: "&a"
    ADVANCED: "&9"
    EXPERT: "&5"
    MASTER: "&6"
    MYTHIC: "&c"

# Economy settings
economy:
  # Tier-based repair cost multipliers
  repair_cost_multipliers:
    BASIC: 1.0
    INTERMEDIATE: 1.5
    ADVANCED: 2.5
    EXPERT: 4.0
    MASTER: 6.0
    MYTHIC: 8.0
  # Cost for repairing 1 durability point
  repair_cost_per_durability: 5.0  # Dari 2.0 → 5.0 (2.5x lipat)
  # Fish price multiplier (1.0 = normal price)
  fish_price_multiplier: 0.8  # Dari 1.0 → 0.8 (20% lebih rendah)
  # Whether to apply dynamic pricing based on supply/demand
  dynamic_pricing: true
  # Price fluctuation percentage (0.0 - 1.0)
  price_fluctuation: 0.3  # Dari 0.2 → 0.3 (lebih banyak fluktuasi)

# Player settings
player:
  # Maximum stamina value
  max_stamina: 100.0
  # Stamina regeneration amount per tick
  stamina_regen: 1.0
  # Stamina regeneration delay in ticks
  stamina_regen_delay: 20

# Fishing event settings
events:
  # Minimum time between events in minutes
  min_cooldown_minutes: 30
  
  # Maximum time between events in minutes
  max_cooldown_minutes: 120
  
  # Duration of events in minutes
  duration_minutes: 30
  
  # Chance for an event to occur when checked (percentage)
  chance_percent: 10.0
  
  # Valid biomes for events
  valid_biomes:
    - OCEAN
    - DEEP_OCEAN
    - WARM_OCEAN
    - LUKEWARM_OCEAN
    - COLD_OCEAN
    - DEEP_LUKEWARM_OCEAN
    - DEEP_COLD_OCEAN
    - FROZEN_OCEAN
    - DEEP_FROZEN_OCEAN
    - RIVER
    - FROZEN_RIVER
    - BEACH
    - SNOWY_BEACH

