name: Build and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build Multi-Release JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 and 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 'current'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify Multi-Release JAR Bytecode
        run: |
          JAR_FILE=$(ls build/libs/nusafishing-*.jar | head -n 1)
          echo "Inspecting $JAR_FILE"
          javap -verbose -cp "$JAR_FILE" id.nusafishing.NusaFishing | grep "major version: 65"
          unzip -p "$JAR_FILE" META-INF/versions/25/id/nusafishing/compat/PlatformHelper.class > /tmp/PlatformHelper25.class
          javap -verbose /tmp/PlatformHelper25.class | grep "major version: 69"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nusafishing-jar
          path: build/libs/*.jar
