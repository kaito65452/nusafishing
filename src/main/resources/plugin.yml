name: nusafishing
main: id.nusafishing.NusaFishing
version: ${version}
website: https://github.com/kaito65452/nusafishing
author: "RanggaGibran"
contributors: ["Asano Saryu"]
api-version: '1.21'
softdepend: [Vault, PlaceholderAPI, Nexo, Oraxen, ItemsAdder, AuraSkills]

commands:
  nusafishing:
    description: Perintah utama plugin NusaFishing
    aliases: [nf, fishing]
    usage: /nusafishing help

permissions:
  nusafishing.rod:
    description: Izin untuk mendapatkan pancingan custom
    default: op
  nusafishing.bait:
    description: Izin untuk mendapatkan umpan custom
    default: op
  nusafishing.afk:
    description: Izin untuk menggunakan mode auto-fishing (/nf afk)
    default: true
  nusafishing.admin:
    description: Izin admin untuk semua perintah
    default: op
    children:
      nusafishing.admin.reload: true
      nusafishing.give: true
      nusafishing.give.fish: true
      nusafishing.give.bait: true
      nusafishing.give.rod: true
      nusafishing.view: true
      nusafishing.fishbook: true
      nusafishing.rod: true
      nusafishing.bait: true
      nusafishing.repair: true
      nusafishing.sell: true
      nusafishing.shop: true
      nusafishing.afk: true
      nusafishing.stats: true
      nusafishing.stats.others: true
  nusafishing.admin.reload:
    description: Izin untuk memuat ulang konfigurasi
    default: op
  nusafishing.repair:
    description: Izin untuk memperbaiki pancingan custom
    default: true
  nusafishing.sell:
    description: Izin untuk menjual ikan
    default: true
  nusafishing.shop:
    description: Izin untuk menggunakan toko
    default: true
  nusafishing.collector:
    description: Izin untuk menggunakan kolektor ikan mistik
    default: true
  nusafishing.admin.tournament:
    description: Izin untuk mengelola turnamen memancing
    default: op
  nusafishing.stats:
    description: Izin untuk melihat statistik memancing diri sendiri
    default: true
  nusafishing.stats.others:
    description: Izin untuk melihat statistik pemain lain
    default: op
  nusafishing.give:
    description: Izin induk untuk memberikan ikan, umpan, atau pancingan
    default: op
    children:
      nusafishing.give.fish: true
      nusafishing.give.bait: true
      nusafishing.give.rod: true
  nusafishing.give.fish:
    description: Izin untuk memberikan ikan custom (/nf give fish)
    default: op
  nusafishing.give.bait:
    description: Izin untuk memberikan umpan custom (/nf give bait)
    default: op
  nusafishing.give.rod:
    description: Izin untuk memberikan pancingan custom (/nf give rod)
    default: op
  nusafishing.view:
    description: Izin untuk melihat katalog item (/nf view)
    default: true
  nusafishing.fishbook:
    description: Izin untuk membuka buku koleksi ikan (/nf fishbook)
    default: true
