# ==============================================================================
# NusaFishing - Stable Anti-Inflation Fishing Configuration (fishing.yml)
# ==============================================================================
config_schema: 2
config_version: "1.5"
# MATHEMATICAL PRICING ENGINE EXPLANATION:
# ------------------------------------------------------------------------------
# The NusaFishing engine calculates the final sale price of each fish via:
#
#   1. Quality Factor = Quality / ((min_quality + max_quality) / 2)
#      (Varies between ~0.80 and ~1.25)
#
#   2. Tier Multiplier:
#      COMMON = 1.0x | UNCOMMON = 1.5x | RARE = 2.0x | EPIC = 3.0x |
#      LEGENDARY = 5.0x | MYTHIC = 8.0x
#
#   3. Weight Diminishing Returns Factor:
#      - Under 10 kg:  Weight / ((min_weight + min(10.0, max_weight)) / 2)  (Linear)
#      - 10 to 100 kg: 1.0 + (log10(Weight / 10.0) * 2.0)                  (Logarithmic)
#      - Over 100 kg:  3.0 + (sqrt(Weight / 100.0) * 0.5)                  (Square Root)
#
#   4. Maintenance Deductions:
#      Deduction = min(Weight * 0.01, 10.0 coins)
#
#   5. Final Formula:
#      FinalPrice = max(1.0, (base_price * QualityFactor * TierMultiplier * WeightFactor) - Deduction)
#
# WHY THIS MODEL PREVENTS ECONOMY COLLAPSE:
# ------------------------------------------------------------------------------
# In old configs, large fish base prices of 500 - 2,500 multiplied by square root
# and tier multipliers yielded individual fish sales of 10,000 - 50,000 coins.
# In this calibrated configuration:
#   - COMMON base (2.0 - 5.0) yields 3.0 - 7.5 coins
#   - UNCOMMON base (6.0 - 15.0) yields 10.0 - 25.0 coins
#   - RARE base (20.0 - 45.0) yields 35.0 - 90.0 coins
#   - EPIC base (50.0 - 100.0) yields 120.0 - 280.0 coins
#   - LEGENDARY base (120.0 - 250.0) yields 350.0 - 850.0 coins
#   - MYTHIC base (350.0 - 650.0) yields 1,200.0 - 2,800.0 coins
#
# Active catch rate is ~180-220 fish/hour. Equipment repair + bait cost naturally
# tax 20-30% of turnover, maintaining a permanent equilibrium.
# ==============================================================================

