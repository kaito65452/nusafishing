# NusaFishing Configuration
config_version: "1.4+SNAPSHOT"
# Konfigurasi untuk alat pancing, umpan, dan ikan-ikan

# Pengaturan alat pancing
# ==============================================================================
# PANDUAN PENGGUNAAN TEKSTUR / ITEM PROVIDER (Vanilla, Nexo, Oraxen, ItemsAdder):
# Untuk menggunakan tekstur custom pada alat pancing manapun di bawah, tambahkan:
#   texture_provider: vanilla | nexo | oraxen | itemsadder
#   texture_id: "<id_item>"
#   material: FISHING_ROD       # Fallback jika plugin tekstur tidak aktif
#   custom_model_data: 1001     # Fallback integer CMD / resource pack vanilla
#
# CONTOH PENERAPAN PADA ALAT PANCING (cukup terapkan pada rod yang diinginkan):
#   # Nexo:
#   #   texture_provider: nexo
#   #   texture_id: "carbon_rod"
#   # Oraxen:
#   #   texture_provider: oraxen
#   #   texture_id: "mythic_rod"
#   # ItemsAdder:
#   #   texture_provider: itemsadder
#   #   texture_id: "nusafishing:poseidon_rod"
# ==============================================================================
fishing_rods:
  basic_rod:
    name: "Pancingan Bambu"
    description: "Pancingan sederhana dari bambu"
    custom_model_data: 1001
    durability: 50
    stamina_modifier: 1.0
    tier: BASIC
    special_ability: false
    price: 1500  # Dari 500 → 1,500 (3x lipat)
    lure_level: 1
    max_weight_capacity: 25.0
    
  intermediate_rod:
    name: "Pancingan Fiber"
    description: "Pancingan modern dengan stamina yang lebih baik"
    custom_model_data: 1002
    durability: 150
    stamina_modifier: 0.7
    tier: INTERMEDIATE
    special_ability: false
    price: 7500  # Dari 2,000 → 7,500 (3.75x lipat)
    lure_level: 2
    max_weight_capacity: 100.0
    
  advanced_rod:
    name: "Pancingan Carbon"
    description: "Pancingan profesional dengan performa terbaik"
    custom_model_data: 1003
    durability: 300
    stamina_modifier: 0.5
    tier: ADVANCED
    special_ability: true
    ability_description: "10% kesempatan mendapat ikan tier lebih tinggi"
    price: 25000  # Dari 5,000 → 25,000 (5x lipat)
    lure_level: 3
    max_weight_capacity: 500.0
    
  expert_rod:
    name: "Pancingan Master"
    description: "Pancingan hasil tempaan terbaik"
    custom_model_data: 1004
    durability: 500
    stamina_modifier: 0.4
    tier: EXPERT
    special_ability: true
    ability_description: "20% kesempatan double catch"
    price: 75000  # Dari 10,000 → 75,000 (7.5x lipat)
    lure_level: 4
    max_weight_capacity: 2500.0
    
  legendary_rod:
    name: "Pancingan Legenda Laut"
    description: "Konon hanya nelayan legendaris yang bisa menggunakannya"
    custom_model_data: 1005
    durability: 1000
    stamina_modifier: 0.3
    tier: MASTER
    special_ability: true
    ability_description: "5% kesempatan mendapat ikan legendaris"
    price: 250000  # Dari 20,000 → 250,000 (12.5x lipat)
    lure_level: 5
    max_weight_capacity: 10000.0

  mythic_rod:
    name: "Pancingan Trisula Samudera"
    description: "Pancingan sakti yang dialiri kekuatan samudra purba"
    custom_model_data: 1006
    durability: 2500
    stamina_modifier: 0.2
    tier: MYTHIC
    special_ability: true
